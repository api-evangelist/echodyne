aid: echodyne
name: Echodyne
description: 'Echodyne Corp is a Kirkland, Washington radar platform company that designs
  and manufactures metamaterials electronically scanned array (MESA) radar systems for
  defense, government, critical infrastructure protection, uncrewed aircraft systems (UAS),
  advanced air mobility (AAM) and autonomous platforms. Its product line spans the compact
  K-band EchoGuard 4D surveillance radar, the medium-range Ku-band EchoShield multi-mission
  4D radar, the airborne EchoFlight radar, and EchoWare — the software platform that manages
  a network of radars as a single instance and exposes radar management and data output to
  external command-and-control systems. Radar data (range-Doppler spectrograms, detections,
  measurements, tracks and radar status) is delivered in a proprietary format over standard
  TCP/IP Gigabit and 10 Gbps Ethernet, with multiple data-rich output options available via
  API. Developer-facing material — API documentation, manuals, tooling and the ATAK plugin —
  is distributed through the login-gated Echodyne Customer Portal rather than a public
  developer portal, so no machine-readable OpenAPI, AsyncAPI or GraphQL contract is published
  on the open web.'
