  x-access-note: On-premise / device-local API. No public base URL is published; the radar
    network is addressed on the operator's own network over TCP/IP Ethernet.
- aid: echodyne:portal-identity
  name: Echodyne Customer Portal Identity (OpenID Connect)
  description: 'The Echodyne Customer Portal is the login-gated distribution point for radar
    software, manuals, tools, the ATAK plugin and support. It runs on Salesforce Experience
    Cloud and publishes an anonymous OpenID Connect discovery document at
    /.well-known/openid-configuration, exposing standard OAuth 2.0 / OIDC authorization,
    token, userinfo, introspection, revocation, dynamic client registration and JWKS
    endpoints. This is the only publicly discoverable machine-readable API surface Echodyne
    serves on the open web; all other portal paths return 401.'
  humanURL: https://portal.echodyne.com/s/login/
  baseURL: https://portal.echodyne.com
