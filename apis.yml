apis:
- aid: echodyne:echoware
  name: EchoWare Radar Management and Data API
  description: 'EchoWare is Echodyne''s software platform for MESA radar. It manages a
    network of Echodyne radars as a single radar instance with one Track ID per object, and
    supports headless operation in which a command-and-control system uses well-defined data
    and management APIs to directly manage the radar network. Radar management options are
    consolidated behind a single API. Data output is delivered over Gigabit / 10 Gbps Ethernet
    as range-Doppler spectrograms, detections, measurements, tracks and radar status. The API
    reference, manuals and integration material are distributed through the login-gated
    Echodyne Customer Portal; no public machine-readable contract is published.'
  humanURL: https://www.echodyne.com/radar-systems/echoware
  tags:
  - Radar
  - Sensors
  - Counter-UAS
  - Situational Awareness
